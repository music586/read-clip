name: Verify and publish public site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      BASE_PATH: ${{ vars.BASE_PATH }}
    steps:
      - name: Check out private source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Check content and unit tests
        run: npm run check

      - name: Build public artifacts and search index
        run: npm run build

      - name: Audit private content boundary
        run: npm run audit:private

      - name: Run browser acceptance tests
        run: npm run test:e2e

      - name: Publish only dist to the public repository
        env:
          PAGES_REPOSITORY: ${{ vars.PAGES_REPOSITORY }}
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        working-directory: dist
        run: |
          test -n "$PAGES_REPOSITORY"
          test -n "$PAGES_DEPLOY_TOKEN"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA}"
          git branch -M main
          git remote add pages "https://x-access-token:${PAGES_DEPLOY_TOKEN}@github.com/${PAGES_REPOSITORY}.git"
          git push --force pages main
